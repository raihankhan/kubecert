{{ template "kubecert-controller.prepare-certs" $ }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubecert-controller.fullname" . }}-webhook-cert
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubecert-controller.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  ca.crt: {{ $._caCrt }}
  tls.crt: {{ $._serverCrt }}
  tls.key: {{ $._serverKey }}